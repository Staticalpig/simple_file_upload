services:
    db:
        image: postgres:18.6-bookworm
        environment:
          DB_HOST: "db"
          DB_NAME: "file_db"
          POSTGRES_USER: "postgres"
          POSTGRES_PASSWORD: "password"
          POSTGRES_DB: "file_db"
        ports:
        - "5432:5432"
        volumes:
          - db_volume:/var/lib/postgresql/data
          - ./init.sql:/docker-entrypoint-initdb.d/init.sql
        networks:
            - file_upload_network
        healthcheck:
          test: [ "CMD-SHELL", "pg_isready -U axum" ]
          interval: 10s
          timeout: 5s
          retries: 5
    app:
        build: .
        ports:
        - "8080:8080"
        depends_on:
          - db
        networks:
            - file_upload_network

networks:
    file_upload_network:

volumes:
    db_volume: